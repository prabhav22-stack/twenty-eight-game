<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#143e26"/>
      <stop offset="60%" stop-color="#071b10"/>
      <stop offset="100%" stop-color="#020804"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0cd"/>
      <stop offset="35%" stop-color="#e5c158"/>
      <stop offset="70%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#7a5500"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square / Icon Tile -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85"/>
  <rect x="24" y="24" width="464" height="464" rx="86" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4"/>
  
  <!-- Corner Suit Symbols -->
  <text x="56" y="80" font-size="36" fill="#e5c158" opacity="0.75" font-family="serif">♠</text>
  <text x="430" y="80" font-size="36" fill="#ef4444" opacity="0.75" font-family="serif">♥</text>
  <text x="56" y="460" font-size="36" fill="#e5c158" opacity="0.75" font-family="serif">♣</text>
  <text x="430" y="460" font-size="36" fill="#ef4444" opacity="0.75" font-family="serif">♦</text>

  <!-- Crown Icon at Top -->
  <path d="M 216 140 L 256 165 L 296 140 L 286 185 L 226 185 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
  <circle cx="216" cy="136" r="6" fill="#fdf0cd"/>
  <circle cx="256" cy="158" r="7" fill="#fdf0cd"/>
  <circle cx="296" cy="136" r="6" fill="#fdf0cd"/>

  <!-- Bold 28 Brand Logo -->
  <text x="256" y="325" font-size="185" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4" filter="url(#goldGlow)">28</text>
  
  <!-- Subtitle Ribbon -->
  <text x="256" y="380" font-size="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" fill="#fdf0cd" text-anchor="middle" letter-spacing="8" opacity="0.9">ROYAL CASINO</text>
</svg>